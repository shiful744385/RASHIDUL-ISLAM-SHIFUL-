<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RASHIDUL ISLAM SHIFUL</title>

    <meta name="description" content="RASHIDUL ISLAM SHIFUL - Personal Website">
    <meta name="theme-color" content="#080808">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

            body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;

    background:
        linear-gradient(rgba(0, 0, 20, 0.45), rgba(0, 0, 10, 0.75)),
        url("japan.png") center center / cover fixed no-repeat;

    color: white;
            } }

        /* Background glow */
        body::before {
            content: "";
            position: fixed;
            width: 350px;
            height: 350px;
            background: #ffffff;
            opacity: 0.04;
            filter: blur(100px);
            border-radius: 50%;
            top: -100px;
            left: -100px;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
            animation: fadeIn 1.2s ease;
        }

        .name {
            font-size: clamp(30px, 8vw, 58px);
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 25px;
            line-height: 1.15;
            text-transform: uppercase;

            background: linear-gradient(
                90deg,
                #ffffff,
                #aaaaaa,
                #ffffff
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            background-size: 200% auto;
            animation: shine 4s linear infinite;
        }

        .subtitle {
            color: #999;
            font-size: 14px;
            letter-spacing: 4px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        /* GIF COVER */
        .cover {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 30px;

            border: 1px solid rgba(255,255,255,0.15);

            box-shadow:
                0 20px 60px rgba(0,0,0,0.6),
                0 0 40px rgba(255,255,255,0.04);

            background: #111;
        }

        .cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s ease;
        }

        .cover:hover img {
            transform: scale(1.04);
        }

        /* SOCIAL CARDS */
        .socials {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .social {
            text-decoration: none;
            color: white;

            display: flex;
            align-items: center;

            padding: 17px 20px;

            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);

            border-radius: 18px;

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            transition:
                transform 0.3s ease,
                background 0.3s ease,
                border 0.3s ease;

            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .social:hover {
            transform: translateY(-4px);
            background: rgba(255,255,255,0.11);
            border-color: rgba(255,255,255,0.25);
        }

        .icon {
            width: 45px;
            height: 45px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 14px;

            background: rgba(255,255,255,0.08);

            font-size: 21px;
            margin-right: 15px;
        }

        .info {
            text-align: left;
            flex: 1;
        }

        .platform {
            display: block;
            font-size: 12px;
            color: #888;
            margin-bottom: 3px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .username {
            font-size: 16px;
            font-weight: 600;
        }

        .arrow {
            color: #777;
            font-size: 20px;
            transition: transform 0.3s ease;
        }

        .social:hover .arrow {
            transform: translateX(5px);
            color: white;
        }

        .footer {
            margin-top: 30px;
            color: #555;
            font-size: 12px;
            letter-spacing: 1px;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shine {
            0% {
                background-position: 200% center;
            }

            100% {
                background-position: -200% center;
            }
        }

        /* Mobile */
        @media (max-width: 480px) {

            body {
                padding: 25px 14px;
            }

            .name {
                letter-spacing: 2px;
            }

            .subtitle {
                font-size: 11px;
                letter-spacing: 3px;
            }

            .cover {
                border-radius: 19px;
            }

            .social {
                padding: 14px 15px;
            }

            .icon {
                width: 42px;
                height: 42px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <!-- NAME -->
        <h1 class="name">
            RASHIDUL ISLAM SHIFUL
        </h1>

        <p class="subtitle">
            Welcome to my world
        </p>

        <!-- GIF COVER -->
        <!-- rashidul.gif -->
        <div class="cover">
            <img src="rashidul.gif" alt="Rashidul Islam Shiful">
        </div>

        <!-- SOCIAL MEDIA -->
        <div class="socials">

            <!-- INSTAGRAM -->
            <a
                class="social"
                href="https://www.instagram.com/shiful_st/"
                target="_blank"
                rel="noopener noreferrer"
            >
                <div class="icon">◎</div>

                <div class="info">
                    <span class="platform">Instagram</span>
                    <span class="username">@shiful_st</span>
                </div>

                <span class="arrow">→</span>
            </a>


            <!-- DISCORD -->
            <div class="social">
                <div class="icon">◉</div>

                <div class="info">
                    <span class="platform">Discord</span>
                    <span class="username">shiful.st</span>
                </div>

                <span class="arrow">→</span>
            </div>


            <!-- EMAIL -->
            <a
                class="social"
                href="mailto:rashidul.jp@outlook.com"
            >
                <div class="icon">✉</div>

                <div class="info">
                    <span class="platform">Email</span>
                    <span class="username">
                        rashidul.jp@outlook.com
                    </span>
                </div>

                <span class="arrow">→</span>
            </a>

        </div>

        <div class="footer">
            © 2026 RASHIDUL ISLAM SHIFUL
        </div>

    </main>

</body>
</html>
